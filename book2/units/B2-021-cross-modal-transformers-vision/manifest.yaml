detection_conventions:
  boxes: half-open xyxy pixel edges; x right, y down; arrays index [y,x]
  grid: j=floor(cx*S/W), i=floor(cy*S/H); target=(cx*S/W-j,cy*S/H-i,w/W,h/H)
  boundary: internal boundary centers go right/below; valid centers cannot reach outer
    boundary
  cell_collision: keep largest area; equal area keeps lower source index
