roadmap_version: 1

layers:
  - shared-foundation
  - round-1-core
  - round-2-extension
  - optional-enrichment

planned_units:
  - id: P015-R1-MATH-KERNEL-OPT
    title: Kernel Validity and Convex Optimization
    layer: shared-foundation
    prerequisites: [F3-matrices, F4-multivar-calculus, F6-svd-spectral, C3-gradient-descent]
    knowledge_points: [valid-kernel-positive-definite-proof, convex-sets-functions-and-optimality, constrained-optimization-lagrangian-duality]
    provisional_concepts: [positive-semidefinite-matrices, kernel-validity, convex-sets, convex-functions, first-order-optimality, lagrangians, optimization-duality]
    estimated_hours: {min: 14, max: 20}
    schedule_action: extend
  - id: P015-R1-NEURAL-TRAINING
    title: Neural Losses, Backpropagation, and Training
    layer: round-1-core
    prerequisites: [F4-multivar-calculus, C3-gradient-descent, C5-neural-networks, C6-pytorch]
    knowledge_points: [pytorch-autograd-and-optimizer-training, multilayer-perceptron-model, batch-normalization, dropout, backpropagation-by-hand, softmax, cross-entropy-loss, fully-connected-network-from-scratch]
    provisional_concepts: [softmax, cross-entropy-loss, manual-backpropagation, autograd-training, torch-optimizers, trained-mlp, batch-normalization, dropout]
    estimated_hours: {min: 30, max: 44}
    schedule_action: extend
  - id: P015-R1-CLASSICAL-BREADTH
    title: Classical Supervised and Unsupervised Models
    layer: round-1-core
    prerequisites: [C1-ml-fundamentals, C2-linear-models, C3-gradient-descent, C4-classical-ml-practice, P015-R1-MATH-KERNEL-OPT]
    knowledge_points: [logistic-regression, support-vector-machine, decision-trees, ensemble-learning, k-means-clustering]
    provisional_concepts: [logistic-regression, svm, decision-trees, ensemble-learning, k-means]
    estimated_hours: {min: 32, max: 48}
    schedule_action: extend
  - id: P015-R2-TRANSFORMERS-NLP
    title: Attention, Transformers, and NLP
    layer: round-2-extension
    prerequisites: [C6-pytorch, C7-cnn-transfer, C8-embeddings, P015-R1-NEURAL-TRAINING]
    knowledge_points: [attention-mechanism-foundations, self-attention, multi-head-attention, positional-encoding, attention-complexity-analysis, attention-from-scratch, transformer-architecture-foundations, transformer-nlp-applications, vision-transformers, graph-neural-network-transformer-applications, nlp-transformers, nlp-pretraining, nlp-fine-tuning]
    provisional_concepts: [attention, self-attention, multi-head-attention, positional-encoding, transformer-blocks, layer-normalization, residual-connections, position-wise-feed-forward-network, attention-complexity, nlp-transformers, pretraining, fine-tuning, vision-transformers, graph-attention]
    estimated_hours: {min: 42, max: 64}
    schedule_action: extend
  - id: P015-R2-VISION-GEN
    title: Advanced Vision and Generative Modeling
    layer: round-2-extension
    prerequisites: [C7-cnn-transfer, P015-R1-NEURAL-TRAINING, P015-R2-TRANSFORMERS-NLP]
    knowledge_points: [object-detection, unet, autoencoder, variational-autoencoder, generative-adversarial-network, denoising-diffusion-probabilistic-models, stable-diffusion, multivariate-gaussian, gaussian-reparameterization, kl-divergence]
    provisional_concepts: [object-detection, unet, autoencoders, vae, reparameterization, kl-divergence, gans, ddpm, stable-diffusion, multivariate-gaussian]
    estimated_hours: {min: 54, max: 82}
    schedule_action: extend
  - id: P015-R2-CAPSTONE
    title: GPU Scientific Modeling Capstone
    layer: round-2-extension
    prerequisites: [C10-competition-craft, P015-R1-CLASSICAL-BREADTH, P015-R2-TRANSFORMERS-NLP, P015-R2-VISION-GEN]
    knowledge_points: [gpu-colab-l4-workflow, semi-supervised-pseudo-labeling, scientific-ml-inverse-problems, open-ended-experiment-design, open-ended-model-evaluation, mixture-parameter-regression]
    provisional_concepts: [colab-gpu-workflow, semi-supervised-learning, pseudo-labeling, inverse-problems, scientific-ml, experiment-design, ablation-analysis, mixture-parameter-estimation]
    estimated_hours: {min: 30, max: 46}
    schedule_action: extend

