[project]
name = "usaaio-tools"
version = "0.1.0"
description = "Verification and build tooling for USAAIO mock tests and teaching materials"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyyaml",
    "scikit-learn>=1.9.0",
]

[project.scripts]
usaaio-tools = "tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
